name: DevSecOps Light
on: [push, pull_request]

jobs:
  security_checks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # notwendig für vollständige Secret-Scans mit Gitleaks

    # 1. Secret Scanning mit Gitleaks (offizielle Action)
    - name: Run Gitleaks Secret Scan
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_CONFIG: .gitleaks.toml

    # 2. Dependency Scanning mit Trivy
    - name: Trivy SCA Scan
      uses: aquasecurity/trivy-action@0.18.0
      with:
        scan-type: 'fs'
        ignore-unfixed: true
        severity: 'CRITICAL,HIGH'
        exit-code: '1'
        format: 'table'
        working-directory: 'backend'

    # 3. SBOM Generierung mit Syft/Anchore
    - name: Generate SBOM
      uses: anchore/sbom-action@v0.15.0
      with:
        path: './backend'
        format: 'spdx-json'
        output-file: 'backend/sbom.spdx.json'
        upload-artifact: false
        artifact-name: 'sbom-siadaia'

    - name: Debug SBOM output
      run: ls -lah backend/ sbom* || echo "No SBOM found"

    - name: Upload SBOM
      uses: actions/upload-artifact@v4
      with:
        name: sbom-siadaia
        path: backend/sbom.spdx.json

    # 4. Dockerfile Linting mit Hadolint
    - name: Check Dockerfile before Hadolint
      run: |
        ls -lah backend/
        cat backend/Dockerfile || echo "Dockerfile not readable"

    - name: Hadolint
      uses: hadolint/hadolint-action@v3.0.0
      with:
        dockerfile: ./backend/Dockerfile
        failure-threshold: warning
        config: ./hadolint.yaml
        verbose: true
    - name: Output Hadolint logs
      if: failure()
      run: echo "Hadolint has failed. Please check the output above for details."


  build:
    needs: security_checks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: |
        cd backend
        docker build -t siadaia-backend .
