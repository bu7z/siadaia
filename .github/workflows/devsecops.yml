name: DevSecOps Light
on: [push, pull_request]

jobs:
  security_checks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 1. Secret Scanning
    - name: Gitleaks
      uses: gitleaks/gitleaks-action@v2  # Aktualisierte Version
      with:
        config-path: .gitleaks.toml  # Korrigierter Dateiname
        fail-on-error: true

    # 2. Dependency Scanning
    - name: Trivy SCA Scan
      uses: aquasecurity/trivy-action@0.18.0
      with:
        scan-type: 'fs'
        ignore-unfixed: true
        severity: 'CRITICAL,HIGH'
        exit-code: '1'
        format: 'table'
        working-directory: 'backend'

    # 3. SBOM Generierung
    - name: Generate SBOM
      uses: anchore/sbom-action@v0.15.0  # Aktualisierte Version
      with:
        output-format: 'spdx-json'
        dir: 'backend'
    
    - name: Upload SBOM
      uses: actions/upload-artifact@v4  # Auf v4 aktualisiert
      with:
        name: sbom
        path: sbom.spdx.json

    # 4. Dockerfile Check
    - name: Hadolint
      uses: hadolint/hadolint-action@v3.0.0  # Korrekte Version
      with:
        dockerfile: backend/Dockerfile
        failure-threshold: warning

  build:
    needs: security_checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cd backend
          docker build -t siadaia-backend .
