server {
    listen 80;
    server_name localhost;  # oder adv-prog.butzke.it

    # Zugriff nur aus dem VPN (optional)
    allow 10.0.0.0/24;
    allow 172.20.0.0/16;
    deny all;

    # Vue App ausliefern
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy zum Flask Backend (z. B. /api/xyz)
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Kamera 1 → 192.168.0.101
    location /cam/1 {
        proxy_pass http://192.168.0.101/axis-cgi/mjpg/video.cgi;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    # Kamera 2 → 192.168.0.102
    location /cam/2 {
        proxy_pass http://192.168.0.102/axis-cgi/mjpg/video.cgi;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    # Kamera 3 → 192.168.0.103
    location /cam/3 {
        proxy_pass http://192.168.0.103/axis-cgi/mjpg/video.cgi;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    # Kamera 4 → 192.168.0.104
    location /cam/4 {
        proxy_pass http://192.168.0.104/axis-cgi/mjpg/video.cgi;
        proxy_http_version 1.1;
        proxy_buffering off;
    }
}
